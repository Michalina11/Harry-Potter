<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Harry Potter - Strona główna</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    font-family: 'Papyrus', 'Cursive', Georgia, serif;
    color: #E0E0E0;
    background-color: #0a0a0f;
    position: relative;
    overflow-x: hidden;
  }
/*atrybut gwiazdek*/
  .stars, .stars2, .stars3 {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-repeat: repeat;
    z-index: -1; /*priorytet nakladania na siebie*/
    pointer-events: none;
  }
  .stars {
    background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
    animation: stars 50s linear infinite;
    opacity: 0.7;
  }
  .stars2 {
    background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
    animation: stars 100s linear infinite;
    opacity: 0.5;
  }
  .stars3 {
    background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
    animation: stars 150s linear infinite;
    opacity: 0.3;
  }
  /*interpretacja animacji czyli co animacja ma robić*/
  @keyframes stars {
    from {background-position: 0 0;}
    to {background-position: 2000px 2000px;}
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

        <li class="nav-item"><a class="nav-link" href="postacie.html">Postacie</a></li>
        <li class="nav-item"><a class="nav-link" href="kontakt.html">Kontakt</a></li>
      </ul>
    </div>
  </div>
</nav>
