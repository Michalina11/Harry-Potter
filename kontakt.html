<div class="container py-5 position-relative">
    <h1 class="text-warning text-center mb-4">Kontakt z Magicznym Światem</h1>
    <p class="text-center mb-5">Masz pytania? Wyślij sowę wiadomość! 🦉✨</p>

    <form class="p-4 bg-black bg-opacity-75 rounded shadow-lg">
        <div class="mb-3">
            <label class="form-label">Imię</label>
            <input type="text" class="form-control" placeholder="Twoje imię">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Twoj email">
        </div>

        <div class="mb-3">
            <label class="form-label">Wiadomość</label>
            <textarea class="form-control" rows="4" placeholder="Twoja magiczna wiadomość..."></textarea>
        </div>

        <button class="btn btn-warning w-100">Wyślij wiadomość ✉️</button>
    </form>
</div>
